name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Run BobaNoteCore tests
        working-directory: BobaNoteCore
        run: swift test

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project BobaNote.xcodeproj \
            -scheme BobaNote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            BOBANOTE_COMMIT="${GITHUB_SHA::7}" \
            CODE_SIGNING_ALLOWED=NO
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BobaNote.app Payload/
          zip -qry BobaNote.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: BobaNote-${{ github.sha }}
          path: BobaNote.ipa
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BobaNote.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Latest main build" --notes "Built from $GITHUB_SHA"
